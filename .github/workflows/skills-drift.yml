name: skills-drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  skills-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate skills from the latest published server
        run: node scripts/sync-skills.mjs

      - name: Report drift
        run: |
          if [ -z "$(git status --porcelain -- skills)" ]; then
            echo "Skills are up to date with hostinger-api-mcp@latest."
          else
            echo "::warning::skills/ is behind hostinger-api-mcp@latest."
            echo "Run 'node scripts/sync-skills.mjs' and commit the result."
            git status --short -- skills
          fi
